name: "Fasit deploy"
description: "Deploy a feature to Fasit"
inputs:
  endpoint:
    description: "Fasit endpoint to deploy to"
    required: true
    default: "http://10.0.0.42"
  chart:
    description: "OCI chart URI"
    required: true
  version:
    description: "Chart version"
    required: true
  target:
    description: "Environment target as JSON object (e.g. {\"kind\":\"management\",\"tenant\":\"nav\"})"
    required: true
  global:
    description: "Mark feature in deployment request as global"
    required: true
    default: "true"
  skip-ci:
    description: "Skip CI for the deployment"
    required: true
    default: "false"
  wait:
    description: "Wait until the deployment finishes before returning"
    required: true
    default: "true"
runs:
  using: "node24"
  main: "src/index.js"
