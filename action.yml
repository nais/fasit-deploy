name: "Fasit deploy"
description: "Deploy a feature assignment to Fasit"
inputs:
  endpoint:
    description: "Fasit endpoint to deploy to"
    required: true
    default: "https://fasit-deploy.nais.io"
  chart:
    description: "OCI chart URI"
    required: true
  version:
    description: "Chart version"
    required: true
  targets:
    description: "Inline JSON array of {target, wait} entries. Mutually exclusive with targets-file."
    required: false
    default: ""
  targets-file:
    description: "Path to a JSON file containing an array of {target, wait} entries. Mutually exclusive with targets."
    required: false
    default: ""
  timeout-minutes:
    description: "Maximum time in minutes to wait for each deployment with wait=true to reach a terminal state. Defaults to 10."
    required: false
    default: "10"
runs:
  using: "node24"
  main: "src/index.js"
